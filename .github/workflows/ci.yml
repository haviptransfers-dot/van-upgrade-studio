name: Site Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sitemap & robots.txt — regenerate sitemap if out of date
        run: node scripts/sync-sitemap.mjs

      - name: Sitemap, robots.txt, structured data & broken links
        run: npm run test

  smoke:
    name: Post-deployment smoke test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium for rendered SEO checks
        run: npx playwright install --with-deps chromium

      - name: Smoke test the live site
        run: node scripts/smoke-test.mjs https://haviptransfers.gr

      - name: Notify on smoke test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Smoke test failed on $(date -u +%Y-%m-%d) — ${GITHUB_SHA:0:7}"
          gh issue create --title "$TITLE" --body-file smoke-failures.md \
            --label "smoke-test" 2>/dev/null || \
          gh issue create --title "$TITLE" --body-file smoke-failures.md

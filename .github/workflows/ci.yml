name: Site Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow syntax & configuration check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Lint workflow files with actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sitemap & robots.txt — regenerate sitemap if out of date
        run: node scripts/sync-sitemap.mjs

      - name: Sitemap, robots.txt, structured data & broken links
        run: npm run test

  smoke:
    name: Post-deployment smoke test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium for rendered SEO checks
        run: npx playwright install --with-deps chromium

      - name: Smoke test the live site
        run: node scripts/smoke-test.mjs https://haviptransfers.gr

      - name: Notify on smoke test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Smoke test failed on $(date -u +%Y-%m-%d) — ${GITHUB_SHA:0:7}"
          gh issue create --title "$TITLE" --body-file smoke-failures.md \
            --label "smoke-test" 2>/dev/null || \
          gh issue create --title "$TITLE" --body-file smoke-failures.md
